<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/isotipo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f1f8f2" />
    <title>MATESHOP — Tu Mate. Tu Historia.</title>

    <!--
      Biblioteca de tipografías del editor (ver src/editor/fonts/fontLibrary.ts
      y docs/PRODUCT.md). Se cargan de Google Fonts, que sirve HTTPS con los
      mismos orígenes que usa la propia guía oficial de Google Fonts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Sacramento, Alex Brush y Anton no llevan ":wght@400;700" porque en
      Google Fonts solo existen en un único peso estático (no tienen variante
      bold) — pedir un peso que no existe hace que la hoja de estilos entera
      falle a cargar ese family. Las demás (nuevas y viejas) sí lo tienen.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Merriweather:wght@400;700&family=Dancing+Script:wght@400;700&family=Lora:wght@400;700&family=Sacramento&family=Alex+Brush&family=Anton&family=Cinzel:wght@400;700&family=Oswald:wght@400;700&family=Caveat:wght@400;700&family=Montserrat:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
